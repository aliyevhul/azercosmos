<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sign in — Career Guidance</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!--
      Standalone on purpose: this page loads before sign-in, so it must not
      pull in the main site bundle (which only signed-in users may load).
    -->
    <style>
      :root {
        --navy: #0f2c4d;
        --blue: #1a6fb5;
        --ink: #1f2328;
        --slate: #5b6472;
        --card: #f2f2f3;
        --line: #d7d9de;
        --red: #d9292b;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background: var(--card);
        display: flex;
        flex-direction: column;
      }
      .stripe { display: flex; height: 6px; }
      .stripe span { flex: 1; }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border-radius: 14px;
        box-shadow: 0 1px 2px rgba(15, 44, 77, 0.06), 0 12px 32px rgba(15, 44, 77, 0.08);
        padding: 36px 32px 32px;
      }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
      .brand img { height: 44px; width: auto; }
      .brand b { display: block; font-family: "Poppins", sans-serif; font-size: 18px; letter-spacing: -0.01em; }
      .brand small { display: block; font-family: "Poppins", sans-serif; font-size: 12px; color: var(--slate); font-weight: 500; }
      h1 { font-family: "Poppins", sans-serif; font-size: 26px; line-height: 1.2; margin: 0 0 8px; }
      p.lead { margin: 0 0 24px; color: var(--slate); font-size: 15px; line-height: 1.5; }
      label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
      .field { margin-bottom: 16px; }
      input {
        width: 100%;
        font: inherit;
        font-size: 16px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        color: var(--ink);
      }
      input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26, 111, 181, 0.2); }
      .pw { position: relative; }
      .pw input { padding-right: 72px; }
      .pw button {
        position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
        border: 0; background: none; color: var(--blue); font: inherit; font-size: 13px; font-weight: 600;
        padding: 6px 8px; border-radius: 6px; cursor: pointer;
      }
      .pw button:hover { background: rgba(26, 111, 181, 0.08); }
      button.submit {
        width: 100%;
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        background: var(--blue);
        color: #fff;
        font-family: "Poppins", sans-serif;
        font-weight: 600;
        font-size: 16px;
        padding: 13px 16px;
        cursor: pointer;
        transition: background 0.15s;
      }
      button.submit:hover { background: #155c97; }
      button.submit:disabled { opacity: 0.7; cursor: progress; }
      .error {
        display: none;
        margin: 0 0 16px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #fdecec;
        color: #9b1c1d;
        font-size: 14px;
        line-height: 1.45;
      }
      .error.show { display: block; }
      .help { margin: 22px 0 0; font-size: 13px; color: var(--slate); line-height: 1.5; text-align: center; }
      .help a { color: var(--blue); }
      .credit { margin: 20px 0 0; font-size: 12px; color: var(--slate); text-align: center; }
      .credit a { color: inherit; }
      :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div class="stripe" aria-hidden="true">
      <span style="background:#1c3d5a"></span><span style="background:#1a6fb5"></span><span style="background:#efb81c"></span>
      <span style="background:#ed7d31"></span><span style="background:#d9292b"></span><span style="background:#a32020"></span>
    </div>
    <main>
      <div class="card">
        <div class="brand">
          <img src="/logo/space-academy-logo.png" alt="Space Academy" />
          <span><b>CAREER GUIDANCE</b><small>Space Academy</small></span>
        </div>
        <h1>Sign in</h1>
        <p class="lead">Use the email and password you received from the Space Academy.</p>

        <form id="form" novalidate>
          <p class="error" id="error" role="alert"></p>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required autofocus />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw">
              <input id="password" name="password" type="password" autocomplete="current-password" required />
              <button type="button" id="toggle" aria-controls="password" aria-pressed="false">Show</button>
            </div>
          </div>
          <button class="submit" id="submit" type="submit">Sign in</button>
        </form>

        <p class="help">
          Forgot your password or don't have an account?<br />
          Contact <a href="mailto:Info.SpaceAcademy@azercosmos.az">Info.SpaceAcademy@azercosmos.az</a>
        </p>
      </div>
      <p class="credit">Website created by Huseyn Aliyev · <a href="mailto:hastudio.az@gmail.com">hastudio.az@gmail.com</a></p>
    </main>

    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        // Only allow returning to a page on this site (no open redirects).
        var next = params.get("next") || "/";
        if (next.charAt(0) !== "/" || next.charAt(1) === "/" || next.charAt(1) === "\\") next = "/";

        var form = document.getElementById("form");
        var email = document.getElementById("email");
        var password = document.getElementById("password");
        var submit = document.getElementById("submit");
        var error = document.getElementById("error");
        var toggle = document.getElementById("toggle");

        function showError(msg) {
          error.textContent = msg;
          error.classList.add("show");
        }

        // Already signed in? Go straight through.
        fetch("/api/auth/me", { credentials: "same-origin" })
          .then(function (r) { if (r.ok) location.replace(next); })
          .catch(function () {});

        toggle.addEventListener("click", function () {
          var show = password.type === "password";
          password.type = show ? "text" : "password";
          toggle.textContent = show ? "Hide" : "Show";
          toggle.setAttribute("aria-pressed", String(show));
        });

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          error.classList.remove("show");
          if (!email.value.trim() || !password.value) {
            showError("Enter your email and password.");
            return;
          }
          submit.disabled = true;
          submit.textContent = "Signing in…";
          fetch("/api/auth/login", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email.value, password: password.value }),
          })
            .then(function (r) {
              return r.json().catch(function () { return {}; }).then(function (data) {
                if (r.ok) {
                  location.replace(next);
                  return;
                }
                showError(data.error || "Couldn't sign in. Please try again.");
                if (r.status === 401) { password.value = ""; password.focus(); }
                submit.disabled = false;
                submit.textContent = "Sign in";
              });
            })
            .catch(function () {
              showError("Couldn't reach the server. Check your connection and try again.");
              submit.disabled = false;
              submit.textContent = "Sign in";
            });
        });
      })();
    </script>
  </body>
</html>
