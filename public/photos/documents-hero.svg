<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c02020"/>
      <stop offset="100%" stop-color="#8a1010"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg5)"/>

  <!-- Background subtle shapes -->
  <circle cx="200" cy="200" r="200" fill="white" opacity="0.03"/>
  <circle cx="1000" cy="600" r="250" fill="white" opacity="0.03"/>

  <!-- Central large folder -->
  <g transform="translate(600, 390)">
    <!-- Shadow -->
    <ellipse cx="5" cy="215" rx="200" ry="20" fill="#0f0505" opacity="0.2"/>

    <!-- Folder tab -->
    <path d="M -200 -190 L -100 -190 Q -80 -190 -70 -170 L -40 -140 L 200 -140 L 200 -190 Z"
          fill="white" opacity="0.85" rx="8"/>

    <!-- Folder body -->
    <rect x="-200" y="-145" width="400" height="360" fill="white" opacity="0.88" rx="10"/>

    <!-- Folder contents — stacked papers -->
    <rect x="-170" y="-115" width="340" height="300" fill="#f8f0f0" opacity="0.6" rx="6" transform="rotate(2)"/>
    <rect x="-170" y="-115" width="340" height="300" fill="#fff0f0" opacity="0.7" rx="6" transform="rotate(-1)"/>
    <rect x="-170" y="-115" width="340" height="300" fill="white" opacity="0.8" rx="6"/>

    <!-- Checklist on top paper -->
    <g transform="translate(-140, -90)">
      <!-- Title line -->
      <rect x="0" y="0" width="260" height="12" fill="#c02020" opacity="0.2" rx="3"/>

      <!-- Check items -->
      <g fill="none" stroke="#c02020" stroke-width="2" opacity="0.5">
        <rect x="0" y="25" width="18" height="18" rx="3"/>
        <rect x="0" y="53" width="18" height="18" rx="3"/>
        <rect x="0" y="81" width="18" height="18" rx="3"/>
        <rect x="0" y="109" width="18" height="18" rx="3"/>
        <rect x="0" y="137" width="18" height="18" rx="3"/>
      </g>

      <!-- Checkmarks (green) on first 3 -->
      <g stroke="#2e7d32" stroke-width="2.5" fill="none" opacity="0.7">
        <polyline points="3,34 8,40 15,29"/>
        <polyline points="3,62 8,68 15,57"/>
        <polyline points="3,90 8,96 15,85"/>
      </g>

      <!-- Lines next to checkboxes -->
      <g fill="#c02020" opacity="0.2">
        <rect x="26" y="29" width="180" height="9" rx="2"/>
        <rect x="26" y="57" width="200" height="9" rx="2"/>
        <rect x="26" y="85" width="160" height="9" rx="2"/>
        <rect x="26" y="113" width="190" height="9" rx="2"/>
        <rect x="26" y="141" width="170" height="9" rx="2"/>
      </g>
    </g>

    <!-- Seal on folder -->
    <circle cx="130" cy="120" r="35" fill="#e6b84e" opacity="0.25"/>
    <circle cx="130" cy="120" r="25" fill="#e6b84e" opacity="0.4"/>
    <text x="130" y="126" text-anchor="middle" fill="#8a1010" font-family="Arial" font-size="20" font-weight="bold" opacity="0.7">✓</text>
  </g>

  <!-- Certificate - left -->
  <g transform="translate(200, 380) rotate(-8)">
    <rect x="-100" y="-120" width="200" height="160" fill="white" opacity="0.75" rx="8"/>
    <!-- Red header -->
    <rect x="-100" y="-120" width="200" height="40" fill="#c02020" opacity="0.6" rx="8"/>
    <rect x="-100" y="-83" width="200" height="3" fill="#c02020" opacity="0.3"/>
    <!-- Content lines -->
    <rect x="-70" y="-65" width="140" height="8" fill="#c02020" opacity="0.15" rx="2"/>
    <rect x="-70" y="-48" width="120" height="7" fill="#c02020" opacity="0.12" rx="2"/>
    <rect x="-70" y="-33" width="130" height="7" fill="#c02020" opacity="0.12" rx="2"/>
    <!-- Signature line -->
    <line x1="-70" y1="10" x2="30" y2="10" stroke="#c02020" stroke-width="1.5" opacity="0.3"/>
    <!-- Seal -->
    <circle cx="65" cy="5" r="22" fill="#e6b84e" opacity="0.5"/>
    <circle cx="65" cy="5" r="14" fill="#e6b84e" opacity="0.6"/>
    <text x="65" y="10" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold" opacity="0.8">★</text>
  </g>

  <!-- Floating document pages - right side -->
  <g transform="translate(1000, 350) rotate(5)">
    <rect x="-80" y="-100" width="160" height="200" fill="white" opacity="0.6" rx="6"/>
    <rect x="-60" y="-70" width="120" height="8" fill="#c02020" opacity="0.2" rx="2"/>
    <rect x="-60" y="-53" width="100" height="7" fill="#c02020" opacity="0.15" rx="2"/>
    <rect x="-60" y="-38" width="110" height="7" fill="#c02020" opacity="0.15" rx="2"/>
    <rect x="-60" y="-23" width="90"  height="7" fill="#c02020" opacity="0.12" rx="2"/>
  </g>
  <g transform="translate(1020, 330) rotate(-4)">
    <rect x="-80" y="-100" width="160" height="200" fill="white" opacity="0.5" rx="6"/>
  </g>

  <!-- Small floating check badges -->
  <g opacity="0.6">
    <circle cx="150" cy="580" r="28" fill="white" opacity="0.15"/>
    <text x="150" cy="580" y="587" text-anchor="middle" fill="white" font-family="Arial" font-size="24" font-weight="bold" opacity="0.5">✓</text>

    <circle cx="1050" cy="200" r="24" fill="white" opacity="0.15"/>
    <text x="1050" y="207" text-anchor="middle" fill="white" font-family="Arial" font-size="20" font-weight="bold" opacity="0.5">✓</text>
  </g>

  <!-- Decorative lines pattern -->
  <g stroke="white" stroke-width="1" opacity="0.06">
    <line x1="0"    y1="100" x2="1200" y2="100"/>
    <line x1="0"    y1="700" x2="1200" y2="700"/>
    <line x1="100"  y1="0"   x2="100"  y2="800"/>
    <line x1="1100" y1="0"   x2="1100" y2="800"/>
  </g>
</svg>
