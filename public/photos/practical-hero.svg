<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8960a"/>
      <stop offset="100%" stop-color="#a07008"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a6e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a3a6e" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg3)"/>

  <!-- Sky gradient behind buildings -->
  <rect width="1200" height="500" fill="url(#skyGrad)" y="200"/>

  <!-- City buildings silhouette -->
  <g fill="#0f1f35" opacity="0.35">
    <!-- Far buildings -->
    <rect x="0"    y="520" width="80"  height="280"/>
    <rect x="100"  y="480" width="60"  height="320"/>
    <rect x="170"  y="540" width="50"  height="260"/>
    <rect x="230"  y="500" width="70"  height="300"/>
    <rect x="310"  y="460" width="55"  height="340"/>
    <rect x="375"  y="530" width="45"  height="270"/>
    <rect x="430"  y="490" width="65"  height="310"/>

    <rect x="750"  y="510" width="60"  height="290"/>
    <rect x="820"  y="470" width="80"  height="330"/>
    <rect x="910"  y="500" width="55"  height="300"/>
    <rect x="975"  y="540" width="45"  height="260"/>
    <rect x="1030" y="480" width="70"  height="320"/>
    <rect x="1110" y="460" width="90"  height="340"/>

    <!-- Windows on buildings (lighter dots) -->
    <g fill="#e6b84e" opacity="0.4">
      <rect x="108" y="490" width="8" height="6" rx="1"/>
      <rect x="122" y="490" width="8" height="6" rx="1"/>
      <rect x="108" y="504" width="8" height="6" rx="1"/>
      <rect x="122" y="504" width="8" height="6" rx="1"/>
      <rect x="108" y="518" width="8" height="6" rx="1"/>

      <rect x="318" y="470" width="8" height="6" rx="1"/>
      <rect x="330" y="470" width="8" height="6" rx="1"/>
      <rect x="342" y="470" width="8" height="6" rx="1"/>
      <rect x="318" y="484" width="8" height="6" rx="1"/>
      <rect x="342" y="484" width="8" height="6" rx="1"/>

      <rect x="830" y="480" width="8" height="6" rx="1"/>
      <rect x="844" y="480" width="8" height="6" rx="1"/>
      <rect x="858" y="480" width="8" height="6" rx="1"/>
      <rect x="830" y="494" width="8" height="6" rx="1"/>
      <rect x="858" y="494" width="8" height="6" rx="1"/>
    </g>
  </g>

  <!-- Central briefcase -->
  <g transform="translate(600, 370)">
    <!-- Shadow -->
    <ellipse cx="5" cy="175" rx="130" ry="18" fill="#0f1f35" opacity="0.2"/>

    <!-- Case body -->
    <rect x="-120" y="-80" width="240" height="180" fill="#0f1f35" opacity="0.8" rx="12"/>
    <rect x="-115" y="-75" width="230" height="170" fill="#1a3a6e" opacity="0.7" rx="10"/>

    <!-- Case handle -->
    <path d="M -50 -80 Q -50 -120 0 -120 Q 50 -120 50 -80" fill="none" stroke="#0f1f35" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M -50 -80 Q -50 -120 0 -120 Q 50 -120 50 -80" fill="none" stroke="#2a5a9e" stroke-width="9" stroke-linecap="round" opacity="0.7"/>

    <!-- Clasp -->
    <rect x="-20" y="-10" width="40" height="25" fill="#e6b84e" opacity="0.85" rx="4"/>
    <rect x="-8"  y="-2"  width="16" height="10" fill="#0f1f35" opacity="0.6" rx="2"/>

    <!-- Center strap line -->
    <line x1="-120" y1="20" x2="120" y2="20" stroke="#0f1f35" stroke-width="3" opacity="0.3"/>

    <!-- Decorative stitching -->
    <rect x="-110" y="-70" width="220" height="160" fill="none" stroke="#e6b84e" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.25" rx="8"/>
  </g>

  <!-- Tool - left spanner -->
  <g transform="translate(320, 420) rotate(-30)">
    <!-- Wrench body -->
    <rect x="-10" y="-90" width="20" height="180" fill="white" opacity="0.25" rx="5"/>
    <!-- Head -->
    <circle cx="0" cy="-90" r="28" fill="white" opacity="0.25"/>
    <circle cx="0" cy="-90" r="16" fill="#c8960a" opacity="0.5"/>
    <!-- Tail fork -->
    <path d="M -10 90 L -20 120 M 10 90 L 20 120" stroke="white" stroke-width="10" opacity="0.2" stroke-linecap="round"/>
  </g>

  <!-- Tool - right pencil -->
  <g transform="translate(880, 400) rotate(20)">
    <polygon points="-12,-90 12,-90 12,110 -12,110" fill="white" opacity="0.22" rx="3"/>
    <polygon points="-12,-90 12,-90 0,-130" fill="#ffe566" opacity="0.45"/>
    <rect x="-12" y="95" width="24" height="20" fill="#e06030" opacity="0.5"/>
    <rect x="-12" y="-90" width="24" height="14" fill="#e6e6e6" opacity="0.35"/>
  </g>

  <!-- Handshake (stylized) -->
  <g transform="translate(600, 620)">
    <!-- Left hand -->
    <path d="M -160 0 Q -100 -20 -60 0 Q -30 15 0 0" fill="none" stroke="white" stroke-width="22" stroke-linecap="round" opacity="0.3"/>
    <!-- Right hand -->
    <path d="M 160 0 Q 100 -20 60 0 Q 30 15 0 0" fill="none" stroke="white" stroke-width="22" stroke-linecap="round" opacity="0.3"/>
    <!-- Join point pulse -->
    <circle cx="0" cy="0" r="18" fill="#e6b84e" opacity="0.55"/>
    <circle cx="0" cy="0" r="10" fill="white" opacity="0.6"/>
  </g>

  <!-- Small floating icons -->
  <!-- Chart bar icon -->
  <g transform="translate(160, 320)" opacity="0.25" fill="white">
    <rect x="0"  y="30" width="16" height="35" rx="2"/>
    <rect x="22" y="15" width="16" height="50" rx="2"/>
    <rect x="44" y="5"  width="16" height="60" rx="2"/>
    <line x1="-5" y1="70" x2="75" y2="70" stroke="white" stroke-width="2.5"/>
  </g>

  <!-- Target icon -->
  <g transform="translate(980, 300)" opacity="0.25">
    <circle cx="30" cy="30" r="30" fill="none" stroke="white" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="20" fill="none" stroke="white" stroke-width="2"/>
    <circle cx="30" cy="30" r="10" fill="white" opacity="0.4"/>
    <circle cx="30" cy="30" r="4"  fill="white"/>
  </g>
</svg>
