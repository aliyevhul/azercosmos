<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d06020"/>
      <stop offset="100%" stop-color="#a04010"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg4)"/>

  <!-- Subtle background circles -->
  <circle cx="600" cy="400" r="380" fill="white" opacity="0.03"/>
  <circle cx="600" cy="400" r="280" fill="white" opacity="0.03"/>

  <!-- Graduation cap - central large -->
  <g transform="translate(600, 280)">
    <!-- Board top -->
    <polygon points="-180,0 0,-70 180,0 0,70" fill="white" opacity="0.9"/>
    <!-- Cap crown -->
    <rect x="-70" y="-15" width="140" height="80" fill="white" opacity="0.85" rx="6"/>
    <!-- Tassel string -->
    <line x1="150" y1="0" x2="150" y2="90"  stroke="white" stroke-width="4" opacity="0.7"/>
    <line x1="150" y1="90" x2="140" y2="130" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="150" y1="90" x2="155" y2="135" stroke="white" stroke-width="3" opacity="0.6"/>
    <line x1="150" y1="90" x2="165" y2="128" stroke="white" stroke-width="3" opacity="0.6"/>
    <circle cx="150" cy="0" r="6" fill="#e6b84e" opacity="0.85"/>
    <!-- Button on top -->
    <circle cx="0" cy="-75" r="12" fill="#e6b84e" opacity="0.9"/>
  </g>

  <!-- Diploma scroll - left -->
  <g transform="translate(240, 450)">
    <!-- Shadow -->
    <ellipse cx="5" cy="125" rx="95" ry="12" fill="#0f1f35" opacity="0.15"/>
    <!-- Scroll body -->
    <rect x="-90" y="-100" width="180" height="200" fill="white" opacity="0.85" rx="8"/>
    <!-- Top roll -->
    <ellipse cx="0" cy="-100" rx="90" ry="18" fill="#f5f0e0" opacity="0.9"/>
    <!-- Bottom roll -->
    <ellipse cx="0" cy="100" rx="90" ry="18" fill="#f5f0e0" opacity="0.9"/>
    <!-- Scroll lines (text simulation) -->
    <g stroke="#d06020" stroke-width="2.5" opacity="0.4">
      <line x1="-55" y1="-55" x2="55" y2="-55"/>
      <line x1="-65" y1="-35" x2="65" y2="-35"/>
      <line x1="-60" y1="-15" x2="60" y2="-15"/>
      <line x1="-55" y1="5"   x2="55" y2="5"/>
      <line x1="-45" y1="25"  x2="45" y2="25"/>
    </g>
    <!-- Seal -->
    <circle cx="0" cy="58" r="28" fill="#e6b84e" opacity="0.8"/>
    <circle cx="0" cy="58" r="20" fill="#d06020" opacity="0.6"/>
    <text x="0" y="63" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold" opacity="0.9">★</text>
    <!-- Ribbon -->
    <rect x="-10" y="-75" width="20" height="12" fill="#e6b84e" opacity="0.7"/>
  </g>

  <!-- Career ladder - right -->
  <g transform="translate(940, 500)">
    <!-- Side rails -->
    <line x1="-60" y1="0" x2="-80" y2="-380" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
    <line x1="60"  y1="0" x2="80"  y2="-380" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.4"/>

    <!-- Rungs - bottom to top getting lighter (progress) -->
    <line x1="-58" y1="-30"  x2="58"  y2="-30"  stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.3"/>
    <line x1="-61" y1="-90"  x2="61"  y2="-90"  stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.4"/>
    <line x1="-64" y1="-150" x2="64"  y2="-150" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
    <line x1="-67" y1="-210" x2="67"  y2="-210" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    <line x1="-70" y1="-270" x2="70"  y2="-270" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
    <line x1="-73" y1="-330" x2="73"  y2="-330" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

    <!-- Star at top of ladder -->
    <g transform="translate(0, -370)">
      <polygon points="0,-20 6,-8 20,-8 10,0 14,14 0,6 -14,14 -10,0 -20,-8 -6,-8"
               fill="#e6b84e" opacity="0.9"/>
    </g>

    <!-- Climbing figure (abstract) -->
    <g transform="translate(0, -170)" opacity="0.5">
      <!-- Body -->
      <circle cx="0" cy="-35" r="14" fill="white"/>
      <!-- Torso -->
      <rect x="-10" y="-22" width="20" height="30" fill="white" rx="5"/>
      <!-- Arms holding rung -->
      <line x1="-70" y1="-10" x2="-10" y2="-5" stroke="white" stroke-width="7" stroke-linecap="round"/>
      <line x1="70"  y1="-10" x2="10"  y2="-5" stroke="white" stroke-width="7" stroke-linecap="round"/>
      <!-- Legs -->
      <line x1="-10" y1="8" x2="-30" y2="35" stroke="white" stroke-width="6" stroke-linecap="round"/>
      <line x1="10"  y1="8" x2="30"  y2="35" stroke="white" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Books stack - bottom left -->
  <g transform="translate(180, 620)">
    <rect x="-70" y="-20" width="180" height="28" fill="#1a3a6e" opacity="0.6" rx="4"/>
    <rect x="-65" y="-45" width="170" height="28" fill="#2a5a9e" opacity="0.55" rx="4"/>
    <rect x="-60" y="-68" width="160" height="26" fill="#0d2a55" opacity="0.6" rx="4"/>
    <!-- Book spines -->
    <rect x="-70" y="-20" width="12" height="28" fill="#e6b84e" opacity="0.5" rx="3"/>
    <rect x="-65" y="-45" width="12" height="28" fill="white" opacity="0.3" rx="3"/>
    <rect x="-60" y="-68" width="12" height="26" fill="#f0b020" opacity="0.45" rx="3"/>
  </g>

  <!-- Floating arrows indicating progress -->
  <g fill="white" opacity="0.2">
    <polygon points="500,600 530,560 560,600 545,600 545,640 515,640 515,600"/>
    <polygon points="640,580 670,540 700,580 685,580 685,625 655,625 655,580"/>
  </g>
</svg>
