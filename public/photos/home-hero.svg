<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <radialGradient id="sky" cx="50%" cy="60%" r="70%">
      <stop offset="0%" stop-color="#1e2d4a"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e6b84e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e6b84e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur8">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.7">
    <circle cx="80"  cy="60"  r="1.5"/>
    <circle cx="160" cy="120" r="1"/>
    <circle cx="240" cy="45"  r="2"/>
    <circle cx="320" cy="90"  r="1.5"/>
    <circle cx="420" cy="30"  r="1"/>
    <circle cx="500" cy="80"  r="2"/>
    <circle cx="580" cy="50"  r="1.5"/>
    <circle cx="660" cy="110" r="1"/>
    <circle cx="740" cy="35"  r="2"/>
    <circle cx="820" cy="70"  r="1.5"/>
    <circle cx="900" cy="25"  r="1"/>
    <circle cx="980" cy="95"  r="2"/>
    <circle cx="1060" cy="55" r="1.5"/>
    <circle cx="1140" cy="80" r="1"/>
    <circle cx="130" cy="200" r="1.5"/>
    <circle cx="290" cy="170" r="1"/>
    <circle cx="450" cy="150" r="2"/>
    <circle cx="630" cy="190" r="1.5"/>
    <circle cx="800" cy="155" r="1"/>
    <circle cx="970" cy="185" r="2"/>
    <circle cx="1100" cy="145" r="1.5"/>
  </g>

  <!-- Large glowing star -->
  <g transform="translate(700, 180)">
    <circle cx="0" cy="0" r="40" fill="url(#glow)"/>
    <circle cx="0" cy="0" r="5" fill="#e6b84e" opacity="0.9"/>
    <line x1="-18" y1="0"  x2="18" y2="0"  stroke="#e6b84e" stroke-width="1.5" opacity="0.6"/>
    <line x1="0"  y1="-18" x2="0"  y2="18" stroke="#e6b84e" stroke-width="1.5" opacity="0.6"/>
    <line x1="-12" y1="-12" x2="12" y2="12" stroke="#e6b84e" stroke-width="1" opacity="0.4"/>
    <line x1="12"  y1="-12" x2="-12" y2="12" stroke="#e6b84e" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Compass rose -->
  <g transform="translate(600, 450)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="#e6b84e" stroke-width="1.5" opacity="0.25"/>
    <circle cx="0" cy="0" r="160" fill="none" stroke="#e6b84e" stroke-width="1" opacity="0.15"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="white" stroke-width="0.8" opacity="0.12"/>

    <!-- Tick marks on outer ring -->
    <g stroke="#e6b84e" stroke-width="1" opacity="0.3">
      <line x1="0" y1="-158" x2="0" y2="-170"/>
      <line x1="158" y1="0" x2="170" y2="0"/>
      <line x1="0" y1="158" x2="0" y2="170"/>
      <line x1="-158" y1="0" x2="-170" y2="0"/>
      <line x1="112" y1="-112" x2="120" y2="-120"/>
      <line x1="112" y1="112" x2="120" y2="120"/>
      <line x1="-112" y1="112" x2="-120" y2="120"/>
      <line x1="-112" y1="-112" x2="-120" y2="-120"/>
    </g>

    <!-- N compass arrow (gold) -->
    <polygon points="0,-115 -14,0 0,20 14,0" fill="#e6b84e" opacity="0.85"/>
    <!-- S arrow (white muted) -->
    <polygon points="0,115 -14,0 0,-20 14,0" fill="white" opacity="0.25"/>
    <!-- E arrow -->
    <polygon points="115,0 0,-14 -20,0 0,14" fill="white" opacity="0.25"/>
    <!-- W arrow -->
    <polygon points="-115,0 0,-14 20,0 0,14" fill="white" opacity="0.25"/>

    <!-- Center circle -->
    <circle cx="0" cy="0" r="14" fill="#e6b84e" opacity="0.9"/>
    <circle cx="0" cy="0" r="7" fill="#0a0f1e"/>

    <!-- Cardinal labels -->
    <text x="0" y="-130" text-anchor="middle" fill="#e6b84e" font-family="Arial, sans-serif" font-size="18" font-weight="bold" opacity="0.8">N</text>
    <text x="0" y="148" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" opacity="0.35">S</text>
    <text x="132" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" opacity="0.35">E</text>
    <text x="-132" y="5" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="14" opacity="0.35">W</text>
  </g>

  <!-- Upward trajectory arrow path -->
  <path d="M 150 720 Q 350 600 500 480 Q 650 360 780 260 Q 880 180 960 140"
        fill="none" stroke="#e6b84e" stroke-width="2.5" stroke-dasharray="8 5" opacity="0.5"/>

  <!-- Arrow head at path end -->
  <g transform="translate(960, 140) rotate(-35)">
    <polygon points="0,-12 -8,8 8,8" fill="#e6b84e" opacity="0.6"/>
  </g>

  <!-- Dots along path -->
  <circle cx="150" cy="720" r="5" fill="#e6b84e" opacity="0.4"/>
  <circle cx="320" cy="590" r="4" fill="#e6b84e" opacity="0.45"/>
  <circle cx="500" cy="480" r="5" fill="#e6b84e" opacity="0.5"/>
  <circle cx="660" cy="370" r="4" fill="#e6b84e" opacity="0.55"/>
  <circle cx="810" cy="270" r="5" fill="#e6b84e" opacity="0.65"/>
  <circle cx="960" cy="140" r="6" fill="#e6b84e" opacity="0.8"/>

  <!-- Horizon glow at bottom -->
  <ellipse cx="600" cy="800" rx="500" ry="120" fill="#e6b84e" opacity="0.06"/>
  <ellipse cx="600" cy="790" rx="300" ry="60"  fill="#e6b84e" opacity="0.08"/>
</svg>
